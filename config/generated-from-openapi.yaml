property_auth:
  tests:
  - name: generated_sensitive_fields_get_users_me
    type: excessive_data_exposure
    role: user
    request:
      method: GET
      path_template: /users/me
    forbidden_fields:
    - password
    - password_hash
    - hashed_password
    - secret
    - token
    - access_token
    - refresh_token
    - api_key
    - private_key
    - ssn
    - national_id
    - credit_card
    - card_number
    - cvv
    - otp_secret
    - mfa_secret
    - reset_token
    business_impact: Sensitive fields may leak into clients, logs, or third-party
      monitoring systems.
    review_required: true
    review_notes:
    - Default sensitive field list was applied.
    - Remove fields that are not relevant and add API-specific sensitive fields.
  - name: generated_mass_assignment_post_orders
    type: mass_assignment
    role: user
    request:
      method: POST
      path_template: /orders
    payloads:
    - name: generated_force_status
      json_body:
        status: approved
      forbidden_effects:
        status: approved
      business_impact: A user may manipulate server-controlled business fields and
        bypass normal workflow controls.
      review_required: true
      review_notes:
      - Generated because request body contains risk field 'status'.
      - Confirm this field is server-controlled for this API.
    - name: generated_force_total_amount
      json_body:
        total_amount: '0.01'
      forbidden_effects:
        total_amount: '0.01'
      business_impact: A user may manipulate server-controlled business fields and
        bypass normal workflow controls.
      review_required: true
      review_notes:
      - Generated because request body contains risk field 'total_amount'.
      - Confirm this field is server-controlled for this API.
    review_required: true
    review_notes:
    - Generated from request body schema for POST /orders.
    - Confirm payload shape includes required non-risk fields before running the scanner.
