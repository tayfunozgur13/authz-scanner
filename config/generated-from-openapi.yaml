  - name: generated_bola_get_orders_order_id
    role: user
    owner_field: owner_id
    resource:
      list_method: GET
      list_path: /orders
      id_field: id
    attack:
      method: GET
      path_template: /orders/{id}
    expected_status: 403
    business_impact: Unauthorized order access or manipulation may expose customer
      purchase data or disrupt fulfillment.
    review_required: true
    review_notes:
    - Generated from OpenAPI path GET /orders/{order_id}.
    - Confirm owner_field and resource.id_field against the real response body.
    - Confirm this resource should be isolated between identities with role user.
