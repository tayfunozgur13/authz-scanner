target:
  name: external-api
  base_url: https://api.example.test

auth:
  login_path: /session
  token_field: token
  login_method: POST
  credential_location: header
  auth_header_name: Authorization
  auth_scheme: Bearer
  cookie_name: null
  login_body:
    email: "{email}"
    password: "{password}"

profile:
  path: /me
  id_field: subject_id

identities:
  owner:
    email: owner@example.test
    password: owner-secret
    role: user
  attacker:
    email: attacker@example.test
    password: attacker-secret
    role: user
  admin:
    email: admin@example.test
    password: admin-secret
    role: admin

bola:
  tests:
    - name: users_cannot_read_each_others_resources
      role: user
      owner_field: owner_id
      resource:
        list_method: GET
        list_path: /resources
        id_field: id
      attack:
        method: GET
        path_template: /resources/{id}
      expected_status: 403
      business_impact: Unauthorized cross-user resource access may expose customer data or allow account-level data tampering.

bfla:
  tests:
    - name: users_cannot_access_admin_functions
      role: user
      attack:
        method: GET
        path_template: /admin/users
      expected_status: 403
      business_impact: Unauthorized access to administrative functions may expose user inventory or enable privileged business operations.

property_auth:
  tests:
    - name: profile_must_not_expose_sensitive_fields
      type: excessive_data_exposure
      role: user
      request:
        method: GET
        path_template: /me
      forbidden_fields:
        - password
        - password_hash
        - token
        - api_key
        - secret
      business_impact: Sensitive field exposure may leak credentials or secrets into client applications and logs.
    - name: create_resource_must_not_accept_server_controlled_fields
      type: mass_assignment
      role: user
      request:
        method: POST
        path_template: /resources
      payloads:
        - name: force_approved_state
          json_body:
            state: approved
          forbidden_effects:
            state: approved
          business_impact: A user may force a server-controlled state and bypass normal review or approval workflows.
